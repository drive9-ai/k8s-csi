apiVersion: v1
kind: Pod
metadata:
  name: drive9-workspace-smoke
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: public.ecr.aws/docker/library/busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          echo hello-drive9 > /drive9/workspace/hello.txt
          cat /drive9/workspace/hello.txt
          sleep 3600
      volumeMounts:
        - name: workspace
          mountPath: /drive9
          mountPropagation: HostToContainer
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: drive9-workspace
