apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drive9-workspace
  annotations:
    drive9.ai/secret-name: drive9-workspace-secret
    # drive9.ai/remote-root: /            # optional, default "/"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: drive9-rwo
  volumeAttributesClassName: drive9-coding-agent-tuned
  resources:
    requests:
      storage: 1Gi
