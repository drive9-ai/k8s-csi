apiVersion: apps/v1
kind: Deployment
metadata:
  name: drive9-csi-controller
  namespace: drive9-csi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drive9-csi-controller
  template:
    metadata:
      labels:
        app: drive9-csi-controller
    spec:
      serviceAccountName: drive9-csi-controller
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
          args:
            - --csi-address=/csi/csi.sock
            - --extra-create-metadata
            - --leader-election
            - --feature-gates=VolumeAttributesClass=true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: drive9-csi
          image: registry.invalid/drive9-csi:unpublished
          imagePullPolicy: IfNotPresent
          args:
            - --endpoint=unix:///csi/csi.sock
            - --service-mode=controller
            - --recover-node-mounts=disabled
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
