apiVersion: apps/v1
kind: Deployment
metadata:
  name: drive9-sidecar-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drive9-sidecar-demo
  template:
    metadata:
      labels:
        app: drive9-sidecar-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do date >> /workspace/heartbeat.log; sleep 10; done"]
          volumeMounts:
            - name: drive9-workspace
              mountPath: /workspace
              mountPropagation: HostToContainer
        - name: drive9-mounter
          image: ghcr.io/drive9-ai/drive9-csi:drive9-aff1023-csi-ef5fab2
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          command:
            - sh
            - -c
            - |
              set -u
              mkdir -p /mnt/drive9 /cache || exit 1

              remote_root="${DRIVE9_REMOTE_ROOT:-/}"
              attr_ttl="${DRIVE9_ATTR_TTL:-30s}"
              entry_ttl="${DRIVE9_ENTRY_TTL:-30s}"
              dir_ttl="${DRIVE9_DIR_TTL:-30s}"
              if [ -z "${attr_ttl}" ] || [ -z "${entry_ttl}" ] || [ -z "${dir_ttl}" ]; then
                echo "DRIVE9_*_TTL must not be empty" >&2
                exit 1
              fi

              case "${remote_root}" in
                /*) ;;
                *)
                  echo "DRIVE9_REMOTE_ROOT must be absolute: ${remote_root}" >&2
                  exit 1
                  ;;
              esac
              while [ "${remote_root}" != "/" ] && [ "${remote_root%/}" != "${remote_root}" ]; do
                remote_root="${remote_root%/}"
              done

              if [ "${remote_root}" != "/" ]; then
                current=""
                rest="${remote_root#/}"
                while [ -n "${rest}" ]; do
                  case "${rest}" in
                    */*)
                      part="${rest%%/*}"
                      rest="${rest#*/}"
                      ;;
                    *)
                      part="${rest}"
                      rest=""
                      ;;
                  esac
                  if [ -z "${part}" ] || [ "${part}" = "." ] || [ "${part}" = ".." ]; then
                    echo "DRIVE9_REMOTE_ROOT contains an unsafe path segment: ${remote_root}" >&2
                    exit 1
                  fi
                  current="${current}/${part}"
                  if ! drive9 fs stat ":${current}" >/dev/null 2>&1; then
                    drive9 fs mkdir ":${current}" || exit 1
                  fi
                done
              fi

              exec drive9 mount \
                --mode=fuse \
                --allow-other \
                --cache-dir /cache \
                --profile "${DRIVE9_PROFILE}" \
                --attr-ttl "${attr_ttl}" \
                --entry-ttl "${entry_ttl}" \
                --dir-ttl "${dir_ttl}" \
                ":${remote_root}" \
                /mnt/drive9
          env:
            - name: DRIVE9_SERVER
              valueFrom:
                secretKeyRef:
                  name: drive9-sidecar-secret
                  key: server
            - name: DRIVE9_API_KEY
              valueFrom:
                secretKeyRef:
                  name: drive9-sidecar-secret
                  key: apiKey
            - name: DRIVE9_REMOTE_ROOT
              value: /
            - name: DRIVE9_PROFILE
              value: coding-agent
            - name: DRIVE9_ATTR_TTL
              value: 30s
            - name: DRIVE9_ENTRY_TTL
              value: 30s
            - name: DRIVE9_DIR_TTL
              value: 30s
          volumeMounts:
            - name: drive9-workspace
              mountPath: /mnt/drive9
              mountPropagation: Bidirectional
            - name: drive9-cache
              mountPath: /cache
            - name: dev-fuse
              mountPath: /dev/fuse
      volumes:
        - name: drive9-workspace
          hostPath:
            path: /var/lib/drive9-sidecar/demo/workspace
            type: DirectoryOrCreate
        - name: drive9-cache
          emptyDir: {}
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
