name: Publish CSI image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "Makefile"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
  workflow_dispatch:
    inputs:
      drive9_ref:
        description: "drive9 commit SHA to bake into the CSI image (overrides Dockerfile default; leave empty to use env default)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/drive9-ai/drive9-csi
  # Repository containing the drive9 CLI baked into the CSI image.
  DRIVE9_REPO: mem9-ai/drive9

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve drive9 ref and tags
        id: image-tags
        shell: bash
        env:
          INPUT_DRIVE9_REF: ${{ inputs.drive9_ref }}
          GH_TOKEN: ${{ github.token }}
          DRIVE9_REPO: ${{ env.DRIVE9_REPO }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DRIVE9_REF:-}" ]; then
            DRIVE9_REF="$INPUT_DRIVE9_REF"
          else
            echo "No drive9_ref input supplied; resolving ${DRIVE9_REPO} main."
            DRIVE9_REF="$(gh api "repos/${DRIVE9_REPO}/commits/main" --jq .sha)"
          fi
          # Require a hex commit SHA (7-40 chars). Earlier alnum-only
          # check accepted branch names like `main` or tags like
          # `v1.2.3` — those pass `git checkout` inside the Dockerfile
          # but produce a NON-REPRODUCIBLE image (branch head can
          # move) and a MISLEADING trace tag like
          # `drive9-main-csi-<csisha7>` that the operator will read
          # as a specific commit. Refuse anything that isn't a hex
          # SHA to guarantee the image name and the baked-in ref
          # match.
          if ! printf '%s' "$DRIVE9_REF" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "Invalid drive9_ref (must be a 7-40 char hex commit SHA): $DRIVE9_REF" >&2
            exit 1
          fi
          echo "drive9_ref=${DRIVE9_REF}" >> "$GITHUB_OUTPUT"

          # Trace tag: drive9-<drive9sha7>-csi-<csisha7>. This is the tag
          # consumed by drive9/prod-cd promotions.
          TRACE_TAG="drive9-${DRIVE9_REF:0:7}-csi-${GITHUB_SHA:0:7}"
          echo "trace_tag=${TRACE_TAG}" >> "$GITHUB_OUTPUT"

          # Publish only traceable tags. Every pushed image tag encodes the
          # resolved drive9 CLI commit and the k8s-csi commit.
          FULL_IMAGE="${IMAGE:-ghcr.io/drive9-ai/drive9-csi}"
          TAGS="${FULL_IMAGE}:${TRACE_TAG}"
          echo "canonical_tag=" >> "$GITHUB_OUTPUT"
          # Multiline output for build-push-action's `tags:` input.
          {
            echo 'tags<<EOF'
            printf '%s\n' "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            DRIVE9_REF=${{ steps.image-tags.outputs.drive9_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/drive9-ai/k8s-csi
            org.opencontainers.image.description=Drive9 Kubernetes CSI driver
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-tags.outputs.trace_tag }}
          tags: ${{ steps.image-tags.outputs.tags }}
