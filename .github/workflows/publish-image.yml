name: Publish CSI image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "Makefile"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/drive9-ai/drive9-csi
  DRIVE9_REF: aff1023d45869664056a1b8ac910efb316b71d5e

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract canonical tag from Makefile
        id: image-tags
        shell: bash
        run: |
          # Read the canonical IMAGE tag defined in Makefile (single source of truth).
          CANONICAL=$(sed -n 's/^IMAGE ?= //p' Makefile)
          CANONICAL_TAG="${CANONICAL##*:}"
          echo "canonical_tag=${CANONICAL_TAG}" >> "$GITHUB_OUTPUT"
          # Also emit a trace tag for CI traceability.
          echo "trace_tag=drive9-${DRIVE9_REF::7}-csi-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            DRIVE9_REF=${{ env.DRIVE9_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/drive9-ai/k8s-csi
            org.opencontainers.image.description=Drive9 Kubernetes CSI driver
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-tags.outputs.canonical_tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.image-tags.outputs.canonical_tag }}
            ${{ env.IMAGE }}:${{ steps.image-tags.outputs.trace_tag }}
