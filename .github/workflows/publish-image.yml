name: Publish CSI image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "Makefile"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/drive9-ai/drive9-csi

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      drive9_version: ${{ steps.drive9_version.outputs.version }}
      tags: ${{ steps.image-tags.outputs.tags }}
      trace_tag: ${{ steps.image-tags.outputs.trace_tag }}
    steps:
      - name: Show latest drive9 CLI version
        id: drive9_version
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          curl -fsSL -o "$TMP_DIR/drive9" https://drive9.ai/releases/drive9-linux-amd64
          chmod +x "$TMP_DIR/drive9"
          "$TMP_DIR/drive9" --version | tee "$TMP_DIR/drive9-version.txt"
          DRIVE9_VERSION="$(awk -F': *' '$1 == "version" {print $2; exit}' "$TMP_DIR/drive9-version.txt" | tr -d '[:space:]')"
          if [ -z "$DRIVE9_VERSION" ]; then
            echo "Failed to resolve drive9 CLI version" >&2
            exit 1
          fi
          echo "Resolved drive9 CLI version: ${DRIVE9_VERSION}"
          echo "version=${DRIVE9_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: image-tags
        shell: bash
        env:
          DRIVE9_VERSION: ${{ steps.drive9_version.outputs.version }}
        run: |
          set -euo pipefail
          SAFE_DRIVE9_VERSION="$(printf '%s' "$DRIVE9_VERSION" | tr -c 'A-Za-z0-9_.-' '-')"
          # Trace tag: drive9-<drive9-cli-version>-csi-<csisha7>.
          TRACE_TAG="drive9-${SAFE_DRIVE9_VERSION}-csi-${GITHUB_SHA:0:7}"
          echo "trace_tag=${TRACE_TAG}" >> "$GITHUB_OUTPUT"

          # Build the full tag list.
          FULL_IMAGE="${IMAGE:-ghcr.io/drive9-ai/drive9-csi}"
          TAGS="${FULL_IMAGE}:${TRACE_TAG}"
          # Multiline output for build-push-action's `tags:` input.
          {
            echo 'tags<<EOF'
            printf '%s\n' "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/drive9-ai/k8s-csi
            org.opencontainers.image.description=Drive9 Kubernetes CSI driver
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.trace_tag }}
            ai.drive9.cli.version=${{ needs.metadata.outputs.drive9_version }}

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${DIGEST#sha256:}"
          if [ -z "$digest" ]; then
            echo "Build did not produce an image digest" >&2
            exit 1
          fi
          touch "/tmp/digests/${digest}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create manifest list
        shell: bash
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=("-t" "$tag")
            fi
          done <<< "$TAGS"
          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "No image tags resolved" >&2
            exit 1
          fi

          sources=()
          while IFS= read -r -d '' digest_file; do
            digest="$(basename "$digest_file")"
            sources+=("${IMAGE}@sha256:${digest}")
          done < <(find /tmp/digests -type f -print0 | sort -z)
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No image digests downloaded" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${{ needs.metadata.outputs.trace_tag }}"
