name: Publish CSI image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "build/**"
      - "Dockerfile"
      - "Makefile"
      - "cmd/**"
      - "deploy/kubernetes/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
  workflow_dispatch:
    inputs:
      drive9_ref:
        description: Full Drive9 source commit; when set, it must equal the locked current commit.
        required: false
        type: string
      compatibility_result_commit:
        description: Full mem9-ai/drive9 commit containing the externally produced compatibility result.
        required: false
        type: string
      compatibility_result_sha256:
        description: SHA-256 of the external compatibility result.
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/drive9-ai/drive9-csi

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      drive9_version: ${{ steps.lock.outputs.version }}
      drive9_source_commit: ${{ steps.lock.outputs.source_commit }}
      tags: ${{ steps.image-tags.outputs.tags }}
      trace_tag: ${{ steps.image-tags.outputs.trace_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read locked Drive9 release
        id: lock
        shell: bash
        env:
          INPUT_DRIVE9_REF: ${{ inputs.drive9_ref }}
        run: |
          set -euo pipefail
          LOCK=build/drive9-cli.lock.json
          DRIVE9_VERSION="$(jq -er '.current.version | select(test("^[0-9a-f]{7}$"))' "$LOCK")"
          DRIVE9_SOURCE_COMMIT="$(jq -er '.current.sourceCommit | select(test("^[0-9a-f]{40}$"))' "$LOCK")"
          if [ -n "${INPUT_DRIVE9_REF:-}" ] && [ "$INPUT_DRIVE9_REF" != "$DRIVE9_SOURCE_COMMIT" ]; then
            echo "drive9_ref must exactly match locked commit $DRIVE9_SOURCE_COMMIT" >&2
            exit 1
          fi
          if [ "$DRIVE9_VERSION" != "${DRIVE9_SOURCE_COMMIT:0:7}" ]; then
            echo "locked Drive9 version does not match its source commit" >&2
            exit 1
          fi
          echo "version=$DRIVE9_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_commit=$DRIVE9_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: image-tags
        shell: bash
        env:
          DRIVE9_VERSION: ${{ steps.lock.outputs.version }}
        run: |
          set -euo pipefail
          TRACE_TAG="drive9-${DRIVE9_VERSION}-csi-${GITHUB_SHA:0:7}"
          echo "trace_tag=${TRACE_TAG}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            printf '%s:%s\n' "$IMAGE" "$TRACE_TAG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify external exact-pair compatibility result
        shell: bash
        env:
          COMPATIBILITY_RESULT_COMMIT: ${{ inputs.compatibility_result_commit || vars.DRIVE9_CSI_COMPATIBILITY_RESULT_COMMIT }}
          COMPATIBILITY_RESULT_SHA256: ${{ inputs.compatibility_result_sha256 || vars.DRIVE9_CSI_COMPATIBILITY_RESULT_SHA256 }}
        run: |
          set -euo pipefail
          LOCK=build/drive9-cli.lock.json
          RESULT="${RUNNER_TEMP}/drive9-csi-compatibility.json"
          if ! printf '%s' "${COMPATIBILITY_RESULT_COMMIT:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "a full mem9-ai/drive9 compatibility producer commit is required" >&2
            exit 1
          fi
          if ! printf '%s' "${COMPATIBILITY_RESULT_SHA256:-}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "external compatibility result SHA-256 is required" >&2
            exit 1
          fi
          RESULT_URL="https://raw.githubusercontent.com/mem9-ai/drive9/${COMPATIBILITY_RESULT_COMMIT}/release/drive9-csi-compatibility.json"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RESULT" "$RESULT_URL"
          printf '%s  %s\n' "$COMPATIBILITY_RESULT_SHA256" "$RESULT" | sha256sum -c -
          if ! jq -e --arg producerCommit "$COMPATIBILITY_RESULT_COMMIT" '
            .schemaVersion == 2 and
            .status == "passed" and
            .producer.repository == "mem9-ai/drive9" and
            .producer.commit == $producerCommit
          ' "$RESULT" >/dev/null; then
            echo "external compatibility result is not a passed schema-v2 result" >&2
            exit 1
          fi
          LOCKED_PAIR="$(jq -cS '
            .compatibilityPlatform as $platform |
            {
              current: {
                sourceCommit: .current.sourceCommit,
                artifact: {
                  kind: "raw-binary",
                  platform: $platform,
                  sha256: .current.artifacts[$platform].sha256
                }
              },
              previous: {
                sourceCommit: .previous.sourceCommit,
                artifact: .previous.artifact
              }
            }
          ' "$LOCK")"
          RESULT_PAIR="$(jq -ecS '.pair' "$RESULT")"
          if [ "$RESULT_PAIR" != "$LOCKED_PAIR" ]; then
            echo "external compatibility result does not match the exact locked N/N-1 pair" >&2
            exit 1
          fi

  build:
    needs:
      - metadata
      - compatibility
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/drive9-ai/k8s-csi
            org.opencontainers.image.description=Drive9 Kubernetes CSI driver
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.trace_tag }}
            ai.drive9.cli.version=${{ needs.metadata.outputs.drive9_version }}
            ai.drive9.cli.source-commit=${{ needs.metadata.outputs.drive9_source_commit }}

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${DIGEST#sha256:}"
          if [ -z "$digest" ]; then
            echo "Build did not produce an image digest" >&2
            exit 1
          fi
          touch "/tmp/digests/${digest}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - metadata
      - compatibility
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create manifest list
        shell: bash
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=("-t" "$tag")
            fi
          done <<< "$TAGS"
          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "No image tags resolved" >&2
            exit 1
          fi

          sources=()
          while IFS= read -r -d '' digest_file; do
            digest="$(basename "$digest_file")"
            sources+=("${IMAGE}@sha256:${digest}")
          done < <(find /tmp/digests -type f -print0 | sort -z)
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No image digests downloaded" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${{ needs.metadata.outputs.trace_tag }}"

      - name: Create digest-pinned Kubernetes manifests
        shell: bash
        env:
          TRACE_TAG: ${{ needs.metadata.outputs.trace_tag }}
        run: |
          manifest_file="${RUNNER_TEMP}/drive9-csi-manifest.json"
          if ! docker buildx imagetools inspect "${IMAGE}:${TRACE_TAG}" \
            --format '{{json .}}' > "$manifest_file"; then
            echo "Could not inspect the published image manifest" >&2
            exit 1
          fi
          if ! image_digest="$(jq -er \
            '.manifest.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$manifest_file")"; then
            echo "Published image did not resolve to an immutable digest" >&2
            exit 1
          fi

          release_root="${RUNNER_TEMP}/drive9-csi-kubernetes"
          release_overlay="${release_root}/overlays/release"
          cp -R deploy/kubernetes "$release_root" || exit 1
          mkdir -p "$release_overlay" || exit 1
          {
            printf '%s\n' 'apiVersion: kustomize.config.k8s.io/v1beta1'
            printf '%s\n' 'kind: Kustomization'
            printf '%s\n' 'resources:' '  - ../..'
            printf '%s\n' 'images:'
            printf '%s\n' '  - name: registry.invalid/drive9-csi'
            printf '%s\n' '    newName: ghcr.io/drive9-ai/drive9-csi'
            printf '    digest: %s\n' "$image_digest"
          } > "${release_overlay}/kustomization.yaml" || exit 1

      - name: Upload digest-pinned Kubernetes manifests
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-manifests-${{ needs.metadata.outputs.trace_tag }}
          path: ${{ runner.temp }}/drive9-csi-kubernetes
          if-no-files-found: error
