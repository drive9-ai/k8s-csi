name: Publish CSI image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "Makefile"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/drive9-ai/drive9-csi
  DRIVE9_REF: 6e2820e22d0592ece7644da1135ba9ef7ba95839

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image-tags
        shell: bash
        run: |
          echo "drive9_short=${DRIVE9_REF::7}" >> "$GITHUB_OUTPUT"
          echo "csi_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            DRIVE9_REF=${{ env.DRIVE9_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/drive9-ai/k8s-csi
            org.opencontainers.image.description=Drive9 Kubernetes CSI driver
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=drive9-${{ steps.image-tags.outputs.drive9_short }}-csi-${{ steps.image-tags.outputs.csi_short }}
          tags: |
            ${{ env.IMAGE }}:drive9-${{ steps.image-tags.outputs.drive9_short }}-csi-${{ steps.image-tags.outputs.csi_short }}
