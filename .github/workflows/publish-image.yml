name: Publish CSI image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/drive9-ai/drive9-csi

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      drive9_version: ${{ steps.release.outputs.version }}
      drive9_source_commit: ${{ steps.release.outputs.source_commit }}
      drive9_release_commit: ${{ steps.release.outputs.release_commit }}
      tags: ${{ steps.image-tags.outputs.tags }}
      trace_tag: ${{ steps.image-tags.outputs.trace_tag }}
    steps:
      - name: Resolve latest Drive9 CLI release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! release_commit=$(gh api \
            --method GET \
            "repos/mem9-ai/drive9-fe/commits" \
            -f path=site/releases/checksums.txt \
            -f per_page=1 \
            --jq '.[0].sha'); then
            echo "Could not resolve the latest Drive9 CLI release commit" >&2
            exit 1
          fi
          if [[ ! "$release_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Latest Drive9 CLI release did not resolve to a full commit SHA" >&2
            exit 1
          fi

          release_base="https://raw.githubusercontent.com/mem9-ai/drive9-fe/${release_commit}/site/releases"
          version_file="${RUNNER_TEMP}/drive9-version"
          checksums_file="${RUNNER_TEMP}/drive9-checksums.txt"
          if ! curl --proto '=https' --tlsv1.2 -fsSL \
            -o "$version_file" "${release_base}/version"; then
            echo "Could not download the Drive9 CLI version" >&2
            exit 1
          fi
          if ! curl --proto '=https' --tlsv1.2 -fsSL \
            -o "$checksums_file" "${release_base}/checksums.txt"; then
            echo "Could not download the Drive9 CLI checksums" >&2
            exit 1
          fi

          version=$(<"$version_file")
          if [[ ! "$version" =~ ^[0-9a-f]{7}$ ]]; then
            echo "Drive9 CLI version must be a seven-character commit prefix" >&2
            exit 1
          fi
          for artifact in drive9-linux-amd64 drive9-linux-arm64; do
            checksum=$(awk -v artifact="$artifact" '
              $2 == artifact { count += 1; value = $1 }
              END { if (count == 1) print value }
            ' "$checksums_file")
            if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Release must contain exactly one checksum for $artifact" >&2
              exit 1
            fi
          done

          if ! source_commit=$(gh api \
            "repos/mem9-ai/drive9/commits/${version}" \
            --jq '.sha'); then
            echo "Could not resolve Drive9 source commit $version" >&2
            exit 1
          fi
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]] || \
            [[ "${source_commit:0:7}" != "$version" ]]; then
            echo "Drive9 source commit does not match release version $version" >&2
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
          printf 'release_commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: image-tags
        shell: bash
        env:
          DRIVE9_VERSION: ${{ steps.release.outputs.version }}
        run: |
          trace_tag="drive9-${DRIVE9_VERSION}-csi-${GITHUB_SHA:0:7}"
          printf 'trace_tag=%s\n' "$trace_tag" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            printf '%s:%s\n' "$IMAGE" "$trace_tag"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs:
      - metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            DRIVE9_CLI_RELEASE_COMMIT=${{ needs.metadata.outputs.drive9_release_commit }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/drive9-ai/k8s-csi
            org.opencontainers.image.description=Drive9 Kubernetes CSI driver
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.trace_tag }}
            ai.drive9.cli.version=${{ needs.metadata.outputs.drive9_version }}
            ai.drive9.cli.source-commit=${{ needs.metadata.outputs.drive9_source_commit }}
            ai.drive9.cli.release-commit=${{ needs.metadata.outputs.drive9_release_commit }}

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${DIGEST#sha256:}"
          if [[ -z "$digest" ]]; then
            echo "Build did not produce an image digest" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.image.outputs.digest }}
      reference: ${{ steps.image.outputs.reference }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create manifest list
        shell: bash
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=("-t" "$tag")
            fi
          done <<< "$TAGS"
          if ((${#tag_args[@]} == 0)); then
            echo "No image tags resolved" >&2
            exit 1
          fi

          shopt -s nullglob
          digest_files=(/tmp/digests/*)
          if ((${#digest_files[@]} == 0)); then
            echo "No image digests downloaded" >&2
            exit 1
          fi
          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file##*/}"
            sources+=("${IMAGE}@sha256:${digest}")
          done

          if ! docker buildx imagetools create \
            "${tag_args[@]}" "${sources[@]}"; then
            echo "Could not create the multi-architecture image manifest" >&2
            exit 1
          fi
          if ! docker buildx imagetools inspect \
            "${IMAGE}:${{ needs.metadata.outputs.trace_tag }}"; then
            echo "Could not inspect the published image manifest" >&2
            exit 1
          fi

      - name: Output published image
        id: image
        shell: bash
        env:
          TRACE_TAG: ${{ needs.metadata.outputs.trace_tag }}
          DRIVE9_VERSION: ${{ needs.metadata.outputs.drive9_version }}
          DRIVE9_SOURCE_COMMIT: ${{ needs.metadata.outputs.drive9_source_commit }}
          DRIVE9_RELEASE_COMMIT: ${{ needs.metadata.outputs.drive9_release_commit }}
        run: |
          image_ref="${IMAGE}:${TRACE_TAG}"
          manifest_file="${RUNNER_TEMP}/drive9-csi-manifest.json"
          if ! docker buildx imagetools inspect "$image_ref" \
            --format '{{json .}}' > "$manifest_file"; then
            echo "Could not inspect the published image manifest" >&2
            exit 1
          fi
          if ! image_digest=$(jq -er \
            '.manifest.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$manifest_file"); then
            echo "Published image did not resolve to an immutable digest" >&2
            exit 1
          fi

          printf 'tag=%s\n' "$TRACE_TAG" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"
          printf 'reference=%s@%s\n' "$IMAGE" "$image_digest" >> "$GITHUB_OUTPUT"
          {
            printf '### Published image\n\n'
            printf -- '- Drive9 CLI version: `%s`\n' "$DRIVE9_VERSION"
            printf -- '- Drive9 source commit: `%s`\n' "$DRIVE9_SOURCE_COMMIT"
            printf -- '- Drive9 release commit: `%s`\n' "$DRIVE9_RELEASE_COMMIT"
            printf -- '- CSI source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Tag: `%s`\n' "$image_ref"
            printf -- '- Digest: `%s`\n' "$image_digest"
            printf -- '- Immutable reference: `%s@%s`\n' "$IMAGE" "$image_digest"
          } >> "$GITHUB_STEP_SUMMARY"
