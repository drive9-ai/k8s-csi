name: Publish CSI image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "Makefile"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/drive9-ai/drive9-csi

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show latest drive9 CLI version
        id: drive9_version
        shell: bash
        run: |
          set -euo pipefail
          DRIVE9_VERSION="$(curl -fsSL https://drive9.ai/releases/version | tr -d '[:space:]')"
          if [ -z "$DRIVE9_VERSION" ]; then
            echo "Failed to resolve latest drive9 CLI version" >&2
            exit 1
          fi
          echo "Latest drive9 CLI version: v${DRIVE9_VERSION}"
          echo "version=${DRIVE9_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: image-tags
        shell: bash
        env:
          DRIVE9_VERSION: ${{ steps.drive9_version.outputs.version }}
        run: |
          set -euo pipefail
          SAFE_DRIVE9_VERSION="$(printf '%s' "$DRIVE9_VERSION" | tr -c 'A-Za-z0-9_.-' '-')"
          # Trace tag: drive9-v<drive9-version>-csi-<csisha7>.
          TRACE_TAG="drive9-v${SAFE_DRIVE9_VERSION}-csi-${GITHUB_SHA:0:7}"
          echo "trace_tag=${TRACE_TAG}" >> "$GITHUB_OUTPUT"

          # Build the full tag list.
          FULL_IMAGE="${IMAGE:-ghcr.io/drive9-ai/drive9-csi}"
          TAGS="${FULL_IMAGE}:${TRACE_TAG}"
          # Multiline output for build-push-action's `tags:` input.
          {
            echo 'tags<<EOF'
            printf '%s\n' "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/drive9-ai/k8s-csi
            org.opencontainers.image.description=Drive9 Kubernetes CSI driver
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-tags.outputs.trace_tag }}
            ai.drive9.cli.version=${{ steps.drive9_version.outputs.version }}
          tags: ${{ steps.image-tags.outputs.tags }}
